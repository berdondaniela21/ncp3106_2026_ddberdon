<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1440w dark</title>
    <style>
      :root {
        --bg: #111111;
        --bg-2: #171717;
        --surface: #101113;
        --panel: #1a1a1d;
        --panel-soft: #1f2024;
        --border: rgba(255, 255, 255, 0.08);
        --text: #f3f3f4;
        --muted: rgba(255, 255, 255, 0.7);
        --red: #b5121b;
        --shadow: rgba(0, 0, 0, 0.35);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 30% 0%, rgba(181, 18, 27, 0.12), transparent 30%),
          linear-gradient(180deg, #080909 0%, #121314 100%);
        font-family: "Inter", "Segoe UI", sans-serif;
        color: var(--text);
      }

      .frame-1440w-dark {
        position: relative;
        width: 1440px;
        height: 900px;
        background: var(--bg);
        overflow: hidden;
        box-shadow: 0 28px 60px var(--shadow);
      }

      .frame-1440w-dark::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(181, 18, 27, 0.08) 0%,
          rgba(181, 18, 27, 0) 28%,
          rgba(181, 18, 27, 0) 100%
        );
        pointer-events: none;
      }

      .section-shell {
        position: absolute;
        left: 80px;
        top: 36px;
        width: 1280px;
        height: 820px;
        background: linear-gradient(180deg, #121416 0%, #090a0b 100%);
        border: 1px solid var(--border);
        overflow: hidden;
      }

      .section-shell::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 15%, rgba(181,18,27,0.14), transparent 30%);
        pointer-events: none;
      }

      .header {
        position: relative;
        height: 70px;
        background: rgba(181, 18, 27, 0.95);
        border-bottom: 1px solid rgba(255,255,255,0.12);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px 0 18px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-mark {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        position: relative;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12);
      }

      .brand-mark::before {
        content: "";
        position: absolute;
        inset: 10px;
        background: white;
        clip-path: polygon(50% 0%, 100% 40%, 100% 100%, 0% 100%, 0% 40%);
      }

      .brand-name {
        font-size: 9px;
        line-height: 1.4;
        font-weight: 700;
        letter-spacing: 2px;
        color: white;
        text-transform: uppercase;
      }

      .nav {
        display: flex;
        align-items: center;
        gap: 28px;
        color: white;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.25px;
        text-transform: uppercase;
      }

      .nav a {
        color: rgba(255,255,255,0.96);
        text-decoration: none;
      }

      .hero {
        position: relative;
        height: calc(100% - 70px);
        background:
          linear-gradient(180deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0) 100%),
          radial-gradient(circle at 50% 30%, rgba(181,18,27,0.18), transparent 30%);
      }

      .hero-inner {
        position: absolute;
        inset: 0;
        padding: 54px 80px 0;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }

      .cta {
        max-width: 420px;
        padding-top: 60px;
      }

      .eyebrow {
        display: inline-block;
        color: rgba(255,255,255,0.72);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0;
        color: white;
        font-size: 60px;
        line-height: 0.95;
        letter-spacing: -2px;
        font-weight: 800;
      }

      .highlight {
        color: #f5d3d5;
      }

      .lead {
        margin-top: 22px;
        color: rgba(255,255,255,0.7);
        font-size: 18px;
        line-height: 1.6;
        max-width: 360px;
      }

      .actions {
        margin-top: 30px;
        display: flex;
        gap: 18px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 165px;
        height: 48px;
        padding: 0 22px;
        border-radius: 999px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        font-size: 12px;
      }

      .button.primary {
        background: var(--red);
        color: white;
        border: 1px solid rgba(255,255,255,0.12);
      }

      .button.secondary {
        background: rgba(255,255,255,0.04);
        color: white;
        border: 1px solid rgba(255,255,255,0.1);
      }

      .visual {
        position: relative;
        width: 520px;
        height: 430px;
        margin-top: 40px;
      }

      .panel {
        position: absolute;
        inset: 0;
        border-radius: 26px;
        background: linear-gradient(135deg, rgba(27,30,34,0.95), rgba(10,12,15,0.9));
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 16px 32px rgba(0,0,0,0.35);
      }

      .panel::before {
        content: "";
        position: absolute;
        right: 10%;
        top: 10%;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(181,18,27,0.52), rgba(181,18,27,0.05) 55%, transparent 70%);
      }

      .chart {
        position: absolute;
        left: 58px;
        right: 44px;
        bottom: 42px;
        height: 140px;
        border-radius: 16px;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.06);
      }

      .chart svg {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="frame-1440w-dark">
      <div class="section-shell">
        <header class="header">
          <div class="brand">
            <div class="brand-mark"></div>
            <div class="brand-name">CPE<br />WARRIOR</div>
          </div>

          <nav class="nav" aria-label="Primary navigation">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">CPE at UE</a>
            <a href="#">Specialization</a>
            <a href="#">Careers</a>
            <a href="#">Specs</a>
            <a href="#">Faculty</a>
          </nav>
        </header>

        <div class="hero">
          <div class="hero-inner">
            <div class="cta">
              <div class="eyebrow">Engineering Excellence</div>
              <h1>Build your <span class="highlight">future</span> in tech.</h1>
              <p class="lead">
                Discover programs, research, and opportunities designed to turn curiosity into impact.
              </p>
              <div class="actions">
                <div class="button primary">Apply now</div>
                <div class="button secondary">Explore programs</div>
              </div>
            </div>

            <div class="visual" aria-hidden="true">
              <div class="panel"></div>
              <div class="chart">
                <svg viewBox="0 0 400 140" preserveAspectRatio="none">
                  <defs>
                    <linearGradient id="g1" x1="0" x2="1">
                      <stop offset="0%" stop-color="#b5121b" stop-opacity="0.9" />
                      <stop offset="100%" stop-color="#f4d7d9" stop-opacity="0.8" />
                    </linearGradient>
                  </defs>
                  <path d="M0,110 C40,98, 70,90, 110,84 S180,60, 230,70 S300,30, 400,20 L400,140 L0,140 Z" fill="rgba(255,255,255,0.05)" />
                  <path d="M0,110 C40,98, 70,90, 110,84 S180,60, 230,70 S300,30, 400,20" fill="none" stroke="url(#g1)" stroke-width="3" stroke-linecap="round" />
                  <circle cx="230" cy="70" r="5" fill="#b5121b" />
                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
